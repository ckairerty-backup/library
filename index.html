<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First Novel</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f1f5f9;
    padding: 20px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 48px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 12px;
  }
  p.subtitle {
    color: #94a3b8;
    font-size: 1.05rem;
    margin-bottom: 36px;
    line-height: 1.5;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  a.btn {
    display: inline-block;
    text-decoration: none;
    padding: 14px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 1rem;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  a.btn:hover {
    transform: translateY(-2px);
  }
  footer {
    margin-top: 36px;
    font-size: 0.8rem;
    color: #64748b;
  }

  body { align-items: flex-start; }
  .card { margin: 60px auto; }

  .novel-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: left;
  }
  .novel-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  .novel-header { display: flex; align-items: center; }
  .info-btn {
    flex: none;
    width: 28px; height: 28px;
    margin-left: 12px;
    border-radius: 50%;
    border: 1.5px solid #94a3b8;
    background: none;
    color: #94a3b8;
    font: italic 700 0.95rem Georgia, serif;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .info-btn:hover { background: #f1f5f9; color: #0f172a; border-color: #f1f5f9; }
  .novel-title-btn {
    flex: 1;
    min-width: 0;
    background: none;
    border: none;
    color: #f1f5f9;
    font-size: 1.05rem;
    font-weight: 600;
    padding: 16px 20px;
    text-align: left;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .novel-title-btn:hover { background: rgba(255,255,255,0.05); }
  .novel-title-btn .chevron {
    transition: transform 0.2s ease;
    font-size: 0.85rem;
    color: #94a3b8;
  }
  .novel-item.open .chevron { transform: rotate(180deg); }
  .novel-files {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 0 20px 20px;
  }
  .novel-item.open .novel-files { display: flex; }
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,23,0.7);
    display: none;
    align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    position: relative;
    max-width: 480px; width: 100%;
    max-height: 80vh; overflow-y: auto;
    text-align: left;
    background: #1e293b;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px;
    padding: 28px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .modal h2 { margin: 0 32px 12px 0; font-size: 1.3rem; }
  .modal .genre {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(56,189,248,0.15);
    color: #7dd3fc;
    font-size: 0.8rem; font-weight: 600;
    margin-bottom: 16px;
  }
  .modal .summary { color: #cbd5e1; line-height: 1.6; white-space: pre-line; margin: 0; }
  .modal-close {
    position: absolute; top: 12px; right: 14px;
    background: none; border: none;
    color: #94a3b8; font-size: 1.6rem; line-height: 1;
    cursor: pointer;
  }
  .modal-close:hover { color: #f1f5f9; }
  .status-msg {
    color: #94a3b8;
    font-size: 0.95rem;
    padding: 12px 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>📖 Welcome to my library</h1>
    <p class="subtitle">Hello, welcome to my novels — pick a title below and download it to read locally.</p>
    <div class="novel-list" id="novelList">
      <p class="status-msg">Loading novels…</p>
    </div>
    <footer>Files will be downloaded directly to your device.</footer>
  </div>

  <div class="modal-overlay" id="infoOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
      <button class="modal-close" id="infoClose" aria-label="Close">&times;</button>
      <h2 id="infoTitle"></h2>
      <span class="genre" id="infoGenre"></span>
      <p class="summary" id="infoSummary"></p>
    </div>
  </div>

  <script>
    const GITHUB_OWNER = "ckairerty-backup";
    const GITHUB_REPO = "library";
    const GITHUB_BRANCH = "main";
    const NOVELS_PATH = "novels";

    function stripQuotes(value) {
      if (/^".*"$/.test(value)) {
        return value.slice(1, -1).replace(/\\n/g, "\n").replace(/\\"/g, '"').replace(/\\\\/g, "\\");
      }
      if (/^'.*'$/.test(value)) return value.slice(1, -1).replace(/''/g, "'");
      return value;
    }

    function parseFrontmatter(text) {
      const match = text.match(/^---\s*\n([\s\S]*?)\n---/);
      const data = {};
      if (!match) return data;
      const lines = match[1].split("\n");
      let i = 0;
      let versions = [];

      while (i < lines.length) {
        const line = lines[i];

        // Old flat "files:" list format from Decap's list widget looks like:
        // files:
        //   - label: Standard Version
        //     file: /novels/foo.docx
        //     color: '#38bdf8'
        if (/^files:\s*$/.test(line)) {
          i++;
          let current = null;
          while (i < lines.length && /^(\s{2,}-|\s{4,}\w)/.test(lines[i])) {
            const itemLine = lines[i];
            const dashMatch = itemLine.match(/^\s*-\s*(\w+):\s*(.*)$/);
            const nestedMatch = itemLine.match(/^\s+(\w+):\s*(.*)$/);
            if (dashMatch) {
              if (current) versions.push(current);
              current = {};
              current[dashMatch[1]] = stripQuotes(dashMatch[2].trim());
            } else if (nestedMatch && current) {
              current[nestedMatch[1]] = stripQuotes(nestedMatch[2].trim());
            }
            i++;
          }
          if (current) versions.push(current);
          continue;
        }

        const idx = line.indexOf(":");
        if (idx !== -1) {
          const key = line.slice(0, idx).trim();
          let value = line.slice(idx + 1).trim();
          // Multi-line text (YAML block scalar: |, |-, >, >-)
          if (/^[|>][+-]?$/.test(value)) {
            const folded = value[0] === ">";
            const block = [];
            i++;
            while (i < lines.length && (/^\s/.test(lines[i]) || lines[i].trim() === "")) {
              block.push(lines[i].replace(/^ {1,2}/, ""));
              i++;
            }
            data[key] = block.join(folded ? " " : "\n").trim();
            continue;
          }
          data[key] = stripQuotes(value);
        }
        i++;
      }

      // Old fixed-field format (standard_file / expanded_file) — kept for backward compatibility
      if (data.standard_file) versions.push({ label: "Standard Version", file: data.standard_file });
      if (data.expanded_file) versions.push({ label: "Expanded Version", file: data.expanded_file });

      data._versions = versions;
      return data;
    }

    // Adds an alpha channel to a hex color for the glow/shadow effect
    function hexWithAlpha(hex, alpha) {
      if (!hex || !/^#([0-9a-fA-F]{6})$/.test(hex)) return `rgba(56,189,248,${alpha})`;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    async function loadNovels() {
      const listEl = document.getElementById("novelList");
      try {
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${NOVELS_PATH}?ref=${GITHUB_BRANCH}`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error("Could not list novels");
        const items = await res.json();
        const mdFiles = items.filter(i => i.name.endsWith(".md"));

        if (mdFiles.length === 0) {
          listEl.innerHTML = '<p class="status-msg">No novels published yet.</p>';
          return;
        }

        const entries = await Promise.all(mdFiles.map(async (file) => {
          const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${NOVELS_PATH}/${file.name}`;
          const rawRes = await fetch(rawUrl);
          const rawText = await rawRes.text();
          const data = parseFrontmatter(rawText);
          return data;
        }));

        listEl.innerHTML = "";
        entries.forEach((entry) => {
          const title = entry.title || "Untitled";

          const item = document.createElement("div");
          item.className = "novel-item";

          const header = document.createElement("div");
          header.className = "novel-header";

          const btn = document.createElement("button");
          btn.className = "novel-title-btn";
          const titleSpan = document.createElement("span");
          titleSpan.textContent = title;
          const chevron = document.createElement("span");
          chevron.className = "chevron";
          chevron.textContent = "▼";
          btn.append(titleSpan, chevron);
          btn.addEventListener("click", () => item.classList.toggle("open"));
          header.appendChild(btn);

          if (entry.genre || entry.summary) {
            const info = document.createElement("button");
            info.className = "info-btn";
            info.textContent = "i";
            info.title = "About this novel";
            info.setAttribute("aria-label", "About " + title);
            info.addEventListener("click", (e) => {
              e.stopPropagation();
              openInfo(title, entry.genre, entry.summary);
            });
            header.appendChild(info);
          }

          const filesWrap = document.createElement("div");
          filesWrap.className = "novel-files";

          const versions = entry._versions || [];
          if (versions.length === 0) {
            filesWrap.innerHTML = '<p class="status-msg">No files uploaded yet.</p>';
          } else {
            versions.forEach((v, i) => {
              const a = document.createElement("a");
              a.className = "btn";
              const color = v.color || "#38bdf8";
              a.style.background = color;
              a.style.color = "#0f172a";
              a.style.boxShadow = `0 6px 20px ${hexWithAlpha(color, 0.35)}`;
              a.href = v.file;
              a.setAttribute("download", "");
              a.textContent = v.label || `Version ${i + 1}`;
              filesWrap.appendChild(a);
            });
          }

          item.appendChild(header);
          item.appendChild(filesWrap);
          listEl.appendChild(item);
        });
      } catch (err) {
        listEl.innerHTML = '<p class="status-msg">Could not load novels right now.</p>';
        console.error(err);
      }
    }

    const overlay = document.getElementById("infoOverlay");
    function openInfo(title, genre, summary) {
      document.getElementById("infoTitle").textContent = title;
      const g = document.getElementById("infoGenre");
      g.textContent = genre || "";
      g.style.display = genre ? "inline-block" : "none";
      document.getElementById("infoSummary").textContent = summary || "";
      overlay.classList.add("show");
    }
    function closeInfo() { overlay.classList.remove("show"); }
    document.getElementById("infoClose").addEventListener("click", closeInfo);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeInfo(); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeInfo(); });

    loadNovels();
  </script>
</body>
</html>
